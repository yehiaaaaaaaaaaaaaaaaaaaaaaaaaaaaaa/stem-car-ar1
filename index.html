```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>STEM Racing Car AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
        }

        .ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            padding: 15px 25px;

            font-size: 18px;
            font-family: Arial, sans-serif;

            border: none;
            border-radius: 10px;

            background: black;
            color: white;

            cursor: pointer;
        }

    </style>

</head>

<body>

    <model-viewer
        src="AR.glb"
        alt="STEM Racing Car"
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">

        <button
            slot="ar-button"
            class="ar-button">
            View in AR
        </button>

    </model-viewer>

</body>

</html>
